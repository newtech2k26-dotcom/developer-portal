{% extends "devs/base.html" %}

{% block content %}

<div class="menu-form-container">

    <div class="page-header">

        <h1>{{ page_title }}</h1>

        <a
            href="{% url 'menu_management' %}"
            class="back-btn"
        >
            ← Back
        </a>

    </div>


    <form
        method="post"
        class="menu-form"
    >

        {% csrf_token %}

        {% for field in form %}

        <div class="form-group">

            <label for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

            {{ field }}

            {% if field.errors %}

                <div class="field-error">

                    {% for error in field.errors %}

                        {{ error }}

                    {% endfor %}

                </div>

            {% endif %}

        </div>

        {% endfor %}


        <div class="form-actions">

            <button
                type="submit"
                class="save-btn"
            >
                Save
            </button>

            <a
                href="{% url 'menu_management' %}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
