<!-- =========================================================
     DELETE MENU MODAL CONTENT
========================================================= -->

<div class="delete-modal-container">

<div class="delete-modal-icon">
    !
</div>

<h2>
    Delete Menu
</h2>

<p>
    Are you sure you want to delete

    <span class="delete-menu-name">
        {{ menu.menu_name }}
    </span>

    ?
</p>

<form
    method="post"
    action="{{ request.path }}"
    class="delete-menu-form"
>

    {% csrf_token %}

    <div class="delete-modal-actions">

        <button
            type="button"
            class="cancel-btn"
            onclick="closeDeleteModal()"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="confirm-delete-btn"
        >
            Yes, Delete
        </button>

    </div>

</form>

</div>
