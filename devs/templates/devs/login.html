{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Developer Portal</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;

    background:
        linear-gradient(
            rgba(15, 23, 42, 0.68),
            rgba(15, 23, 42, 0.78)
        ),
        url("{% static 'images/loginWallpaper.avif' %}")
        center center / cover no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.login-card {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 18px;
    padding: 38px 36px;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.30);

    backdrop-filter: blur(8px);
}

.login-header {
    text-align: center;
    margin-bottom: 30px;
}

.login-icon {
    width: 64px;
    height: 64px;

    margin: 0 auto 16px;

    border-radius: 50%;

    background: #2563eb;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
}

.login-header h1 {
    color: #0f172a;
    font-size: 26px;
    margin-bottom: 7px;
}

.login-header p {
    color: #64748b;
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;

    color: #334155;
    font-size: 14px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    height: 46px;

    border: 1px solid #cbd5e1;
    border-radius: 9px;

    padding: 0 13px;

    font-size: 15px;
    color: #1e293b;

    outline: none;

    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
}

.error-message {
    background: #fef2f2;
    border: 1px solid #fecaca;

    color: #b91c1c;

    padding: 11px 13px;
    border-radius: 8px;

    font-size: 14px;

    margin-bottom: 18px;

    text-align: center;
}

.login-button {
    width: 100%;
    height: 46px;

    border: none;
    border-radius: 9px;

    background: #2563eb;
    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: background 0.2s, transform 0.1s;
}

.login-button:hover {
    background: #1d4ed8;
}

.login-button:active {
    transform: scale(0.98);
}

.footer-text {
    text-align: center;

    margin-top: 24px;

    color: #94a3b8;
    font-size: 12px;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <div class="login-icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p>Sign in to Developer Portal</p>

        </div>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    User ID
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username|default:'' }}"
                    placeholder="Enter your user ID"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

        <div class="footer-text">
            All rights reserved by DjangoPython®
        </div>

    </div>

</div>

</body>
</html>
