<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Developer Portal
        {% endblock %}
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }


        /* ---------- TOP BAR ---------- */

        .topbar {

            height: 60px;

            background: #0f172a;

            color: #fff;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }


        .app-name {

            font-size: 20px;

            font-weight: 600;

            letter-spacing: 0.3px;
        }


        .topbar-right {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .user-name {

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 600;

            padding: 9px 12px;
        }


        .home-btn,
        .logout-btn {

            display: flex;

            align-items: center;

            gap: 6px;

            color: #fff;

            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;

            transition: background 0.15s;
        }


        .home-btn {

            background: #2563eb;
        }


        .home-btn:hover {

            background: #1d4ed8;
        }


        .logout-btn {

            background: #dc2626;
        }


        .logout-btn:hover {

            background: #b91c1c;
        }


        /* ---------- LAYOUT ---------- */

        .layout {

            display: flex;

            min-height: calc(100vh - 60px);
        }


        /* ---------- SIDEBAR ---------- */

        .sidebar {

            width: 280px;

            background: #1e293b;

            color: #e2e8f0;

            transition: width 0.3s ease;

            overflow: hidden;

            flex-shrink: 0;

            order: -1;
        }


        .sidebar.collapsed {

            width: 52px;
        }


        .sidebar-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 16px 18px;

            border-bottom: 1px solid #334155;
        }


        .sidebar-title {

            font-weight: 600;

            white-space: nowrap;
        }


        .sidebar.collapsed .sidebar-title {

            display: none;
        }


        .toggle-btn {

            background: #334155;

            color: #fff;

            border: none;

            width: 32px;

            height: 32px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

            flex-shrink: 0;
        }


        .toggle-btn:hover {

            background: #475569;
        }


        /* ---------- MENU ---------- */

        .menu,
        .submenu {

            list-style: none;

            margin: 0;

            padding: 0;
        }


        .sidebar.collapsed nav {

            display: none;
        }


        .menu-link {

            display: flex;

            align-items: center;

            justify-content: space-between;

            width: 100%;

            padding: 12px 18px;

            cursor: pointer;

            white-space: nowrap;

            transition: background 0.15s;

            user-select: none;

            color: #e2e8f0;

            text-decoration: none;
        }


        .menu-link:hover {

            background: #334155;
        }


        /* ---------- FIRST CHILD LEVEL ---------- */

        .submenu > li > .menu-link {

            padding-left: 34px;

            font-size: 14px;
        }


        /* ---------- SECOND CHILD LEVEL ---------- */

        .submenu .submenu > li > .menu-link {

            padding-left: 50px;

            font-size: 13px;

            color: #cbd5e1;
        }


        /* ---------- THIRD CHILD LEVEL ---------- */

        .submenu .submenu .submenu > li > .menu-link {

            padding-left: 66px;

            font-size: 13px;

            color: #cbd5e1;
        }


        .chevron {

            transition: transform 0.25s ease;

            font-size: 12px;
        }


        li.open > .menu-link > .chevron {

            transform: rotate(90deg);
        }


        .submenu {

            max-height: 0;

            overflow: hidden;

            transition: max-height 0.3s ease;
        }


        li.open > .submenu {

            max-height: 1000px;
        }


        /* ---------- LEAF MENU ---------- */

        .leaf {

            color: #94a3b8;
        }


        .leaf:hover {

            color: #fff;
        }


        /* ---------- REMOVE NORMAL LINK APPEARANCE ---------- */

        .sidebar a.menu-link {

            color: #94a3b8;

            text-decoration: none;
        }


        .sidebar a.menu-link:visited {

            color: #94a3b8;
        }


        .sidebar a.menu-link:hover {

            color: #fff;

            text-decoration: none;
        }


        /* ---------- MAIN CONTENT ---------- */

        .main {

            flex: 1;

            padding: 50px;
        }


        {% block extra_css %}

        {% endblock %}

    </style>

</head>


<body>


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">

        <span class="app-name">
            Developer Portal
        </span>


        <div class="topbar-right">

            <span class="user-name">

                👤

                {{ request.user.first_name|title }}

                {{ request.user.last_name|title }}

            </span>


            <a
                href="/"
                class="home-btn"
            >
                🏠 Home
            </a>


            <a
                href="{% url 'logout' %}"
                class="logout-btn"
            >
                🚪 Logout
            </a>

        </div>

    </header>



    <!-- =====================================================
         MAIN LAYOUT
         ===================================================== -->

    <div class="layout">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside
            class="sidebar"
            id="sidebar"
        >


            <div class="sidebar-header">

                <span class="sidebar-title">
                    Menu
                </span>


                <button
                    class="toggle-btn"
                    id="toggleBtn"
                    title="Collapse / expand"
                >
                    ›
                </button>

            </div>


            <nav>

                <ul class="menu">

                    {% include "devs/menu_recursive.html" with menus=portal_menu %}

                </ul>

            </nav>


        </aside>



        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="main">

            {% block content %}

            {% endblock %}

        </main>


    </div>



    <!-- =====================================================
         MENU JAVASCRIPT
         ===================================================== -->

    <script>


        /* ---------- OPEN / CLOSE SUBMENU ---------- */

        document
            .querySelectorAll('.has-children > .menu-link')
            .forEach(function (link) {

                link.addEventListener('click', function () {

                    link.parentElement.classList.toggle('open');

                });

            });



        /* ---------- SIDEBAR COLLAPSE / EXPAND ---------- */

        const sidebar =
            document.getElementById('sidebar');


        const toggleBtn =
            document.getElementById('toggleBtn');


        toggleBtn.addEventListener('click', function () {

            sidebar.classList.toggle('collapsed');


            toggleBtn.textContent =
                sidebar.classList.contains('collapsed')
                    ? '‹'
                    : '›';

        });


    </script>


</body>

</html>
